services:
  - type: web
    name: nba-timemachine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --app-dir . --host 0.0.0.0 --port $PORT
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LEAGUES_FILE
        value: /data/leagues.json
