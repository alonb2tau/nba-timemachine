name: Keep Render instance warm

on:
  schedule:
    # every 10 minutes — comfortably under Render's ~15 minute free-tier
    # spin-down window, so real visitors never hit the cold-start delay
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: curl -sf -o /dev/null -w "HTTP %{http_code}\n" https://nba-timemachine.onrender.com/
